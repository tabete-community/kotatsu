remote_theme: pages-themes/tactile@v0.2.0
plugins:
- jekyll-remote-theme # add this line to the plugins list if you already have one
- jekyll-feed
- jekyll-seo-tag

title:  "Tabete"
header_image: assets/img/mrtabete/inside.png
description: "Tabete is a collective of senior independent consultants in DevOps, automation, infrastructure-as-code and CI/CD."

collections:
  pages:
    output: true
    permalink: /:name/
  authors:
    output: true          # tells Jekyll to publish the files
    permalink: /author/:name/
